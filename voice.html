<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse — غرفة صوتية</title>
<style>
  body { font-family: Tahoma, Arial, sans-serif; background:#0f1115; color:#e8e8e8; max-width:520px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; }
  #status { font-size:13px; color:#9aa; margin-bottom:14px; }
  .ok { color:#4caf50; }
  input { width:100%; box-sizing:border-box; padding:10px; border-radius:8px; border:1px solid #333; background:#1a1d24; color:#eee; font-size:15px; }
  button { padding:10px 18px; border-radius:8px; border:none; background:#5865f2; color:#fff; cursor:pointer; font-size:14px; margin-top:10px; }
  button:hover { background:#4752c4; }
  button:disabled { background:#444; cursor:not-allowed; }
  #muteBtn.muted { background:#c2185b; }
  #leaveBtn { background:#333; }
  .peers { margin-top:16px; }
  .peer { background:#1a1d24; border:1px solid #2a2d34; border-radius:8px; padding:10px; margin-top:8px; font-size:14px; display:flex; align-items:center; gap:8px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#4caf50; }
  .row { display:flex; gap:8px; }
</style>
</head>
<body>

<h1>🎙️ Pulse — غرفة صوتية</h1>
<div id="status">اكتب اسم الغرفة وادخل</div>
<div id="identity" style="font-size:12px; color:#888; margin-bottom:10px;"></div>

<div id="joinBox">
  <input id="roomInput" placeholder="اسم الغرفة (مثال: room1)" value="room1">
  <button id="joinBtn">ادخل الغرفة</button>
</div>

<div id="inRoomBox" style="display:none;">
  <div class="row">
    <button id="muteBtn">🎤 كتم</button>
    <button id="leaveBtn">مغادرة</button>
  </div>
  <div class="peers" id="peers"></div>
</div>

<script type="module">
import { SimplePool, finalizeEvent, generateSecretKey, getPublicKey, nip19 } from 'https://esm.sh/nostr-tools@2.24.2';

const RELAYS = ['wss://relay.damus.io', 'wss://relay.primal.net', 'wss://nos.lol'];
const pool = new SimplePool();
const statusEl = document.getElementById('status');
const identityEl = document.getElementById('identity');
const peersEl = document.getElementById('peers');

function bytesToHex(b){ return [...b].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function hexToBytes(h){ return Uint8Array.from(h.match(/.{2}/g).map(x=>parseInt(x,16))); }

let sk = localStorage.getItem('pulse_sk');
if (!sk) { sk = bytesToHex(generateSecretKey()); localStorage.setItem('pulse_sk', sk); }
const skBytes = hexToBytes(sk);
const pk = getPublicKey(skBytes);
identityEl.textContent = 'هويتك: ' + nip19.npubEncode(pk).slice(0,20) + '...';

const KIND_PRESENCE = 21000; // إعلان وجود في الغرفة (ephemeral)
const KIND_SIGNAL = 21001;   // offer/answer/candidate (ephemeral)

let roomId = null;
let localStream = null;
let presenceTimer = null;
let sub = null;
const peerConnections = new Map(); // pubkey -> RTCPeerConnection
const seenSignals = new Set();

function publish(event) {
  pool.publish(RELAYS, event).forEach(p => p.catch(()=>{}));
}

function sendSignal(targetPk, type, payload) {
  const event = finalizeEvent({
    kind: KIND_SIGNAL,
    created_at: Math.floor(Date.now()/1000),
    tags: [['p', targetPk], ['room', roomId]],
    content: JSON.stringify({ type, payload }),
  }, skBytes);
  publish(event);
}

function announcePresence() {
  const event = finalizeEvent({
    kind: KIND_PRESENCE,
    created_at: Math.floor(Date.now()/1000),
    tags: [['room', roomId]],
    content: '',
  }, skBytes);
  publish(event);
}

function addPeerRow(peerPk) {
  if (document.getElementById('peer-'+peerPk)) return;
  const div = document.createElement('div');
  div.className = 'peer';
  div.id = 'peer-'+peerPk;
  div.innerHTML = `<span class="dot"></span> ${peerPk.slice(0,10)}...`;
  peersEl.appendChild(div);
}
function removePeerRow(peerPk) {
  document.getElementById('peer-'+peerPk)?.remove();
}

function createPeerConnection(peerPk) {
  const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

  pc.onicecandidate = (e) => {
    if (e.candidate) sendSignal(peerPk, 'candidate', e.candidate);
  };
  pc.ontrack = (e) => {
    let audio = document.getElementById('audio-'+peerPk);
    if (!audio) {
      audio = document.createElement('audio');
      audio.id = 'audio-'+peerPk;
      audio.autoplay = true;
      document.body.appendChild(audio);
    }
    audio.srcObject = e.streams[0];
  };
  pc.onconnectionstatechange = () => {
    if (['disconnected','failed','closed'].includes(pc.connectionState)) {
      peerConnections.delete(peerPk);
      removePeerRow(peerPk);
      document.getElementById('audio-'+peerPk)?.remove();
    }
  };
  peerConnections.set(peerPk, pc);
  addPeerRow(peerPk);
  return pc;
}

async function handlePresence(fromPk) {
  if (fromPk === pk || peerConnections.has(fromPk)) return;
  // تحديد حتمي: صاحب المفتاح الأصغر هو اللي يبعت العرض (offer)، عشان محدش يبعت اتنين
  if (pk < fromPk) {
    const pc = createPeerConnection(fromPk);
    const offer = await pc.createOffer({ offerToReceiveAudio: true });
    await pc.setLocalDescription(offer);
    sendSignal(fromPk, 'offer', offer);
  }
}

async function handleSignal(fromPk, msg) {
  let pc = peerConnections.get(fromPk);
  if (msg.type === 'offer') {
    if (!pc) pc = createPeerConnection(fromPk);
    await pc.setRemoteDescription(new RTCSessionDescription(msg.payload));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    sendSignal(fromPk, 'answer', answer);
  } else if (msg.type === 'answer') {
    if (pc) await pc.setRemoteDescription(new RTCSessionDescription(msg.payload));
  } else if (msg.type === 'candidate') {
    if (pc) { try { await pc.addIceCandidate(msg.payload); } catch(e){} }
  }
}

async function joinRoom() {
  roomId = document.getElementById('roomInput').value.trim();
  if (!roomId) return;

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    statusEl.textContent = 'لازم تسمح باستخدام المايك';
    return;
  }

  document.getElementById('joinBox').style.display = 'none';
  document.getElementById('inRoomBox').style.display = 'block';
  statusEl.innerHTML = '<span class="ok">دخلت الغرفة: ' + roomId + '</span>';

  const presenceSub = pool.subscribeMany(RELAYS,
    { kinds:[KIND_PRESENCE], '#room':[roomId], since: Math.floor(Date.now()/1000) - 10 },
    { onevent(event) { handlePresence(event.pubkey); } }
  );
  const signalSub = pool.subscribeMany(RELAYS,
    { kinds:[KIND_SIGNAL], '#p':[pk], '#room':[roomId], since: Math.floor(Date.now()/1000) - 10 },
    { onevent(event) {
        const key = event.id;
        if (seenSignals.has(key)) return;
        seenSignals.add(key);
        try { handleSignal(event.pubkey, JSON.parse(event.content)); } catch(e){}
      }
    }
  );
  sub = { close(){ presenceSub.close(); signalSub.close(); } };

  announcePresence();
  presenceTimer = setInterval(announcePresence, 4000);
}

function leaveRoom() {
  clearInterval(presenceTimer);
  sub?.close();
  peerConnections.forEach(pc => pc.close());
  peerConnections.clear();
  peersEl.innerHTML = '';
  localStream?.getTracks().forEach(t => t.stop());
  document.getElementById('joinBox').style.display = 'block';
  document.getElementById('inRoomBox').style.display = 'none';
  statusEl.textContent = 'اكتب اسم الغرفة وادخل';
}

let muted = false;
document.getElementById('muteBtn').onclick = () => {
  muted = !muted;
  localStream.getAudioTracks().forEach(t => t.enabled = !muted);
  document.getElementById('muteBtn').classList.toggle('muted', muted);
  document.getElementById('muteBtn').textContent = muted ? '🔇 مكتوم' : '🎤 كتم';
};
document.getElementById('leaveBtn').onclick = leaveRoom;
document.getElementById('joinBtn').onclick = joinRoom;
</script>
</body>
</html>
