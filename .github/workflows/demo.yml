name: Pulse Demo

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  run-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: node demo.js
        env:
          NOSTR_SK: ${{ secrets.NOSTR_SK }}
