<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse - Broadcast Radio Quality P2P</title>
    <script src="https://unpkg.com/nostr-tools@1.17.0/lib/nostr.bundle.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #0b0f19;
            --card: #151d2a;
            --border: #232d3f;
            --accent: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --text: #f3f4f6;
            --muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 16px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
        h2 { font-size: 1.1rem; color: #a5b4fc; margin-bottom: 12px; }
        
        input, textarea { width: 100%; background: #070a12; border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 10px; margin-bottom: 10px; outline: none; }
        textarea { height: 70px; resize: none; }

        .btn { background: var(--accent); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-danger { background: var(--danger); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .status-bar { font-size: 0.85rem; color: var(--muted); margin-top: 8px; display: flex; justify-content: space-between; align-items: center; }
        .badge { background: var(--border); padding: 3px 8px; border-radius: 6px; font-size: 0.8rem; }
        .badge.active { background: var(--success); color: black; }

        .feed-item { border-bottom: 1px solid var(--border); padding: 10px 0; }
        .feed-item:last-child { border-bottom: none; }
        .feed-header { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>الغرفة الصوتية (Radio Broadcast HD)</h2>
        <input type="text" id="room-input" placeholder="اسم الغرفة" value="pulse-main-room" />
        <div style="display: flex; gap: 10px;">
            <button class="btn" id="btn-join" onclick="toggleRoom()">دخول الغرفة</button>
            <button class="btn btn-danger" id="btn-mute" onclick="toggleMute()" disabled>كتم المايك</button>
        </div>
        <div class="status-bar">
            <span id="vad-status">الحالة: غير متصل</span>
            <span id="peer-count" class="badge">الأشخاص في الغرفة: 0</span>
        </div>
    </div>

    <div class="card">
        <h2>التغذية المباشرة (Nostr Feed)</h2>
        <textarea id="post-input" placeholder="اكتب منشوراً..."></textarea>
        <button class="btn" onclick="publishPost()">نشر</button>
        <div id="feed-container" style="margin-top: 15px;"></div>
    </div>
</div>

<div id="audio-container" style="display:none;"></div>

<script>
    const APP_TAG = "pulse-v5-radio";
    const NOSTR_RELAY = "wss://relay.damus.io";

    let peer = null;
    let localStream = null;
    let myPeerId = "";
    let currentRoom = "";
    let inRoom = false;
    let isMuted = false;
    let activeCalls = new Map();
    let audioCtx = null;
    let wakeLock = null;
    let sk, pk, ws;

    // Background Audio Hack (Silent WAV Loop) to prevent Mobile Lock Disconnect
    const silentAudio = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==");
    silentAudio.loop = true;

    // SDP Munger: Force Opus 128kbps High Fidelity Radio Quality
    function forceRadioQualitySDP(sdp) {
        return sdp.replace(/a=fmtp:111 .*/g, 'a=fmtp:111 minptime=10;useinbandfec=1;stereo=1;sprop-stereo=1;maxaveragebitrate=128000;cbr=1');
    }

    async function init() {
        sk = localStorage.getItem('nostr_sk_v5') || NostrTools.generatePrivateKey();
        localStorage.setItem('nostr_sk_v5', sk);
        pk = NostrTools.getPublicKey(sk);

        ws = new WebSocket(NOSTR_RELAY);
        ws.onopen = () => {
            subscribeFeed();
            const savedRoom = sessionStorage.getItem('active_voice_room');
            if (savedRoom) {
                document.getElementById('room-input').value = savedRoom;
                toggleRoom();
            }
        };

        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if (data[0] === "EVENT" && data[2].kind === 1) {
                renderPost(data[2]);
            } else if (data[0] === "EVENT" && data[2].kind === 20000) {
                try { handleRoomDiscovery(JSON.parse(data[2].content)); } catch(err){}
            }
        };

        initPeerJS();
    }

    function initPeerJS() {
        myPeerId = "pulse-" + Math.random().toString(36).substring(2, 9);
        peer = new Peer(myPeerId, {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelay', credential: 'openrelay' }
                ]
            }
        });

        peer.on('call', (call) => {
            if (!inRoom) return;
            call.answer(localStream, { sdpTransform: forceRadioQualitySDP });
            handleCallEvents(call);
        });
    }

    async function toggleRoom() {
        const btn = document.getElementById('btn-join');
        const roomInput = document.getElementById('room-input');

        if (!inRoom) {
            currentRoom = roomInput.value.trim().toLowerCase() || "pulse-main-room";

            try {
                // Radio Quality Microphone Settings (Studio Sound)
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: false, // Turn off aggressive gating for raw radio warm tone
                        autoGainControl: false,  // Preserves dynamic audio range
                        sampleRate: 48000,
                        channelCount: 2          // Stereo
                    }
                });
            } catch (e) {
                alert("يرجى إعطاء صلاحية المايكروفون لالتحاق بالغرفة");
                return;
            }

            // Enable Background Service on Mobile
            enableMobileBackgroundKeepAlive();

            inRoom = true;
            sessionStorage.setItem('active_voice_room', currentRoom);
            btn.innerText = "مغادرة الغرفة";
            btn.classList.add("btn-danger");
            roomInput.disabled = true;
            document.getElementById('btn-mute').disabled = false;

            announcePresence();
            setupVAD();
        } else {
            leaveRoom();
        }
    }

    async function enableMobileBackgroundKeepAlive() {
        try {
            await silentAudio.play();
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: "غرفة Pulse الصوتية",
                    artist: "بث مباشر P2P (Radio Quality)",
                    album: "Pulse Studio"
                });
                navigator.mediaSession.playbackState = "playing";
            }
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch(e) {}
    }

    function leaveRoom() {
        inRoom = false;
        sessionStorage.removeItem('active_voice_room');
        const btn = document.getElementById('btn-join');
        btn.innerText = "دخول الغرفة";
        btn.classList.remove("btn-danger");
        document.getElementById('room-input').disabled = false;
        document.getElementById('btn-mute').disabled = true;

        silentAudio.pause();
        if (wakeLock) { wakeLock.release(); wakeLock = null; }

        if (localStream) localStream.getTracks().forEach(t => t.stop());
        activeCalls.forEach(call => call.close());
        activeCalls.clear();
        document.getElementById('audio-container').innerHTML = "";
        document.getElementById('peer-count').innerText = "الأشخاص في الغرفة: 0";
        document.getElementById('vad-status').innerText = "الحالة: غير متصل";
    }

    function toggleMute() {
        isMuted = !isMuted;
        if (localStream) localStream.getAudioTracks()[0].enabled = !isMuted;
        document.getElementById('btn-mute').innerText = isMuted ? "إلغاء الكتم" : "كتم المايك";
    }

    function announcePresence() {
        if (!inRoom || ws.readyState !== WebSocket.OPEN) return;
        const evt = {
            kind: 20000,
            pubkey: pk,
            created_at: Math.floor(Date.now() / 1000),
            tags: [["t", APP_TAG + "-" + currentRoom]],
            content: JSON.stringify({ peerId: myPeerId })
        };
        evt.id = NostrTools.getEventHash(evt);
        evt.sig = NostrTools.signEvent(evt, sk);
        ws.send(JSON.stringify(["EVENT", evt]));

        ws.send(JSON.stringify([
            "REQ", "room_sub",
            { kinds: [20000], "#t": [APP_TAG + "-" + currentRoom], limit: 10 }
        ]));
    }

    function handleRoomDiscovery(data) {
        if (!inRoom || !data.peerId || data.peerId === myPeerId) return;
        if (!activeCalls.has(data.peerId)) {
            const call = peer.call(data.peerId, localStream, { sdpTransform: forceRadioQualitySDP });
            if (call) handleCallEvents(call);
        }
    }

    function handleCallEvents(call) {
        activeCalls.set(call.peer, call);

        call.on('stream', (remoteStream) => {
            let audio = document.getElementById("audio-" + call.peer);
            if (!audio) {
                audio = document.createElement('audio');
                audio.id = "audio-" + call.peer;
                audio.autoplay = true;
                audio.playsInline = true;
                document.getElementById('audio-container').appendChild(audio);
            }
            audio.srcObject = remoteStream;
            audio.play().catch(() => {});
            updatePeerCount();
        });

        call.on('close', () => removePeerCall(call.peer));
        call.on('error', () => removePeerCall(call.peer));
    }

    function removePeerCall(peerId) {
        const audio = document.getElementById("audio-" + peerId);
        if (audio) audio.remove();
        activeCalls.delete(peerId);
        updatePeerCount();
    }

    function updatePeerCount() {
        document.getElementById('peer-count').innerText = `الأشخاص في الغرفة: ${activeCalls.size}`;
    }

    function setupVAD() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(localStream);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);

        const data = new Uint8Array(analyser.frequencyBinCount);
        const interval = setInterval(() => {
            if (!inRoom) { clearInterval(interval); return; }
            if (isMuted) { document.getElementById('vad-status').innerText = "الحالة: مكتوم"; return; }
            analyser.getByteFrequencyData(data);
            const vol = data.reduce((a, b) => a + b, 0) / data.length;
            document.getElementById('vad-status').innerText = vol > 12 ? "الحالة: تتحدث الآن 🎙️" : "الحالة: متصل (صامت)";
        }, 200);
    }

    function subscribeFeed() {
        ws.send(JSON.stringify([
            "REQ", "feed_sub",
            { kinds: [1], "#t": [APP_TAG], limit: 15 }
        ]));
    }

    function publishPost() {
        const input = document.getElementById('post-input');
        const text = input.value.trim();
        if (!text) return;

        const evt = {
            kind: 1,
            pubkey: pk,
            created_at: Math.floor(Date.now() / 1000),
            tags: [["t", APP_TAG]],
            content: text
        };
        evt.id = NostrTools.getEventHash(evt);
        evt.sig = NostrTools.signEvent(evt, sk);

        ws.send(JSON.stringify(["EVENT", evt]));
        input.value = "";
    }

    const seenEvents = new Set();
    function renderPost(evt) {
        if (seenEvents.has(evt.id)) return;
        seenEvents.add(evt.id);

        const container = document.getElementById('feed-container');
        const div = document.createElement('div');
        div.className = 'feed-item';
        div.innerHTML = `
            <div class="feed-header">${evt.pubkey.substring(0, 8)}... • ${new Date(evt.created_at * 1000).toLocaleTimeString('ar-EG')}</div>
            <div>${escapeHtml(evt.content)}</div>
        `;
        container.prepend(div);
    }

    function escapeHtml(str) {
        return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }

    window.onload = init;
</script>
</body>
</html>
