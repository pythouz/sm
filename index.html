<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pulse Live - Voice Room</title>

    <!-- Manifest & Mobile Meta -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- PeerJS & Nostr Libraries -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/nostr-tools/lib/nostr.bundle.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --danger: #ef4444;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: var(--primary);
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            background: #334155;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .status-badge.active {
            background: #065f46;
            color: #34d399;
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-join {
            background: var(--primary);
            color: white;
        }

        .btn-join:hover {
            background: var(--primary-hover);
        }

        .btn-leave {
            background: var(--danger);
            color: white;
        }

        .audio-container {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Pulse Live Voice Room</h1>
        <div id="status" class="status-badge">غير متصل بالخادم</div>

        <div class="controls">
            <button id="toggleBtn" class="btn-join" onclick="toggleRoom()">دخول الغرفة الصوتية</button>
        </div>
    </div>

    <!-- العناصر الصوتية في المخفي -->
    <div class="audio-container">
        <audio id="silentAudio" loop playsinline webkit-playsinline></audio>
        <div id="remoteAudios"></div>
    </div>

    <script>
        // --- 1. إعدادات الشبكة المتعددة (Relays & Peer) ---
        const RELAYS = [
            'wss://relay.damus.io',
            'wss://nos.lol'
        ];
        
        let inRoom = false;
        let localStream = null;
        let peer = null;
        let activeSockets = [];
        let keepAliveTimer = null;
        let wakeLock = null;

        // Base64 WAV صامت لحماية عملية الميديا في الخلفية
        const SILENT_AUDIO_BASE64 = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
        const silentAudioEl = document.getElementById('silentAudio');
        const statusEl = document.getElementById('status');
        const toggleBtn = document.getElementById('toggleBtn');

        // --- 2. محرك البقاء حياً في الخلفية (Background Engine) ---
        function initBackgroundEngine() {
            // أ) تشغيل الصوت الصامت وتفعيل MediaSession API
            silentAudioEl.src = SILENT_AUDIO_BASE64;
            silentAudioEl.play().then(() => {
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: "Pulse Live Voice Room",
                        artist: "مكالمة صوتية نشطة",
                        album: "Pulse Background Service"
                    });

                    // تجميع أحداث الوسائط لمنع الموبايل من إيقاف الخدمة
                    navigator.mediaSession.setActionHandler('play', () => silentAudioEl.play());
                    navigator.mediaSession.setActionHandler('pause', () => silentAudioEl.play());
                }
            }).catch(err => console.warn("Background audio engine error:", err));

            // ب) منع الشاشة والنظام من الخمول عبر Screen Wake Lock API
            requestWakeLock();
        }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.warn("Wake Lock Error:", err.message);
            }
        }

        // --- 3. نبضات الحفاظ على الـ WebSockets (Heartbeat) ---
        function startHeartbeat() {
            stopHeartbeat();
            keepAliveTimer = setInterval(() => {
                if (inRoom) {
                    // إرسال PING إلى الـ Relays الحية
                    activeSockets.forEach(ws => {
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify(["PING"]));
                        }
                    });

                    // التأكد من استمرار عمل الصوت عند العودة من القفل
                    if (silentAudioEl.paused) {
                        silentAudioEl.play().catch(() => {});
                    }
                }
            }, 10000); // كل 10 ثوانٍ
        }

        function stopHeartbeat() {
            if (keepAliveTimer) clearInterval(keepAliveTimer);
        }

        // --- 4. معالجة أحداث قفل الشاشة والعودة (Visibility API) ---
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible' && inRoom) {
                // إعادة طلب الـ WakeLock إذا فقد أثناء القفل
                await requestWakeLock();

                // استئناف الـ AudioContext إذا قام النظام بتجميده
                if (peer && peer.disconnected) {
                    peer.reconnect();
                }
            }
        });

        // --- 5. منطق الدخول/الخروج وتأسيس الصوت ---
        async function toggleRoom() {
            if (!inRoom) {
                try {
                    // طلب إذن المايك مع تعطيل الآليات المسؤولة عن خفض الصوت تلقائياً
                    localStream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: true
                        },
                        video: false
                    });

                    // تفعيل محرك الخلفية ونبضات Websocket
                    initBackgroundEngine();
                    connectRelays();
                    initPeerJS();

                    inRoom = true;
                    statusEl.innerText = "متصل - الغرفة نشطة (في الخلفية)";
                    statusEl.classList.add('active');
                    toggleBtn.innerText = "مغادرة الغرفة";
                    toggleBtn.className = "btn-leave";

                    startHeartbeat();

                } catch (err) {
                    alert("تعذر الوصول للميكروفون: " + err.message);
                }
            } else {
                leaveRoom();
            }
        }

        function connectRelays() {
            activeSockets = RELAYS.map(url => {
                const ws = new WebSocket(url);
                ws.onopen = () => console.log(`Connected to relay: ${url}`);
                ws.onerror = (e) => console.warn(`Relay error ${url}:`, e);
                return ws;
            });
        }

        function initPeerJS() {
            peer = new Peer();

            peer.on('open', (id) => {
                console.log('Peer ID Generated:', id);
            });

            peer.on('call', (call) => {
                call.answer(localStream);
                call.on('stream', (remoteStream) => {
                    addRemoteAudioStream(call.peer, remoteStream);
                });
            });
        }

        function addRemoteAudioStream(peerId, stream) {
            let audio = document.getElementById(`audio-${peerId}`);
            if (!audio) {
                audio = document.createElement('audio');
                audio.id = `audio-${peerId}`;
                audio.autoplay = true;
                audio.playsinline = true;
                audio.setAttribute('webkit-playsinline', '');
                document.getElementById('remoteAudios').appendChild(audio);
            }
            audio.srcObject = stream;
        }

        function leaveRoom() {
            inRoom = false;
            stopHeartbeat();

            // إغلاق المايك
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }

            // إغلاق الاتصالات
            if (peer) peer.destroy();
            activeSockets.forEach(ws => ws.close());
            activeSockets = [];

            // إيقاف صوت البقاء حيّاً
            silentAudioEl.pause();
            if (wakeLock) {
                wakeLock.release().catch(() => {});
                wakeLock = null;
            }

            // استعادة الواجهة
            statusEl.innerText = "غير متصل بالخادم";
            statusEl.classList.remove('active');
            toggleBtn.innerText = "دخول الغرفة الصوتية";
            toggleBtn.className = "btn-join";
        }
    </script>
</body>
</html>
