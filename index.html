<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse - Nostr P2P Platform</title>
    <script src="https://unpkg.com/nostr-tools@1.17.0/lib/nostr.bundle.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        h2 { margin-top: 0; font-size: 1.2rem; color: var(--accent); }

        textarea, input[type="text"] {
            width: 100%;
            background: #090d16;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            padding: 10px;
            box-sizing: border-box;
        }

        textarea { height: 80px; resize: none; }
        input[type="text"] { height: 40px; margin-bottom: 8px; }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 8px;
        }

        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .feed-item {
            border-bottom: 1px solid var(--border);
            padding: 12px 0;
        }
        .feed-item:last-child { border-bottom: none; }
        .author { font-size: 0.8rem; color: var(--text-muted); }
        .content { margin-top: 6px; word-break: break-word; }

        .audio-status {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 12px;
            background: var(--border);
        }

        .badge.active { background: #22c55e; color: black; }
    </style>
</head>
<body>

<div class="container">
    <!-- Identity Header -->
    <div class="card">
        <h2>الهوية والاتصال</h2>
        <div class="author" id="my-pubkey">جاري إنشاء الهوية...</div>
        <div class="author" id="relay-status">جاري الاتصال بالـ Relay...</div>
    </div>

    <!-- Audio Room (Dynamic Name + Cascade P2P) -->
    <div class="card">
        <h2>الغرفة الصوتية (Dynamic P2P Room)</h2>
        <input type="text" id="room-name-input" placeholder="ادخل اسم الغرفة (مثال: main-room)" value="general" />
        <div class="audio-status">
            <button id="btn-join-room" onclick="toggleAudioRoom()">دخول الغرفة</button>
            <button id="btn-mute" onclick="toggleMute()" disabled>كتم المايك</button>
            <span id="vad-indicator" class="badge">صامت</span>
            <span id="peers-count" class="badge">المتصلون المباشرون: 0</span>
        </div>
    </div>

    <!-- Text Post Creation -->
    <div class="card">
        <h2>نشر منشور جديد</h2>
        <textarea id="post-input" placeholder="اكتب شيئاً للشبكة..."></textarea>
        <button onclick="publishPost()">انشر الآن</button>
    </div>

    <!-- Live Feed -->
    <div class="card">
        <h2>التغذية المباشرة (Pulse MVP)</h2>
        <div id="feed-container">في انتظار المنشورات...</div>
    </div>
</div>

<script>
    const APP_TAG = "pulse-mvp-demo-v1";
    const RELAY_URL = "wss://relay.damus.io";
    const MAX_CHILDREN = 3;

    let sk, pk;
    let ws;
    let localStream = null;
    let inRoom = false;
    let isMuted = false;
    let currentRoomName = "";
    let heartbeatInterval = null;
    let peerConnections = new Map(); // Remote PubKey -> RTCPeerConnection
    let childrenKeys = new Set();

    // 1. Initialize Nostr Identity & Relay
    async function init() {
        const storedSk = localStorage.getItem('nostr_sk');
        if (storedSk) {
            sk = storedSk;
        } else {
            sk = NostrTools.generatePrivateKey();
            localStorage.setItem('nostr_sk', sk);
        }
        pk = NostrTools.getPublicKey(sk);

        document.getElementById('my-pubkey').innerText = `المفتاح العام: ${pk.substring(0, 12)}...`;

        // Check if room name is in URL Hash (Auto Rejoin on Refresh)
        if (window.location.hash) {
            const hashRoom = window.location.hash.replace("#", "").trim();
            if (hashRoom) {
                document.getElementById('room-name-input').value = hashRoom;
            }
        }

        ws = new WebSocket(RELAY_URL);

        ws.onopen = () => {
            document.getElementById('relay-status').innerText = `متصل بالشبكة: ${RELAY_URL}`;
            subscribeFeed();
            
            // Auto rejoin if hash existed
            if (window.location.hash) {
                toggleAudioRoom();
            }
        };

        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if (data[0] === "EVENT") {
                const event = data[2];
                if (event.kind === 1) {
                    renderPost(event);
                } else if (event.kind === 20000 && inRoom) {
                    handleSignalingEvent(event);
                }
            }
        };
    }

    // 2. Feed Management
    function subscribeFeed() {
        const req = JSON.stringify([
            "REQ", "feed_sub",
            { kinds: [1], "#t": [APP_TAG], limit: 20 }
        ]);
        ws.send(req);
    }

    async function publishPost() {
        const text = document.getElementById('post-input').value.trim();
        if (!text) return;

        const event = {
            kind: 1,
            pubkey: pk,
            created_at: Math.floor(Date.now() / 1000),
            tags: [["t", APP_TAG]],
            content: text
        };
        event.id = NostrTools.getEventHash(event);
        event.sig = NostrTools.signEvent(event, sk);

        ws.send(JSON.stringify(["EVENT", event]));
        document.getElementById('post-input').value = '';
    }

    const seenPosts = new Set();
    function renderPost(event) {
        if (seenPosts.has(event.id)) return;
        seenPosts.add(event.id);

        const container = document.getElementById('feed-container');
        if (container.innerText.includes("في انتظار")) container.innerHTML = "";

        const div = document.createElement('div');
        div.className = 'feed-item';
        div.innerHTML = `
            <div class="author">${event.pubkey.substring(0, 8)}... • ${new Date(event.created_at * 1000).toLocaleTimeString('ar-EG')}</div>
            <div class="content">${escapeHtml(event.content)}</div>
        `;
        container.prepend(div);
    }

    // 3. Audio & VAD (Voice Activity Detection)
    async function setupAudioWithVAD() {
        localStream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, sampleRate: 24000, channelCount: 1 }
        });

        const audioTrack = localStream.getAudioTracks()[0];
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const analyser = audioCtx.createAnalyser();
        const source = audioCtx.createMediaStreamSource(localStream);
        source.connect(analyser);

        const data = new Uint8Array(analyser.frequencyBinCount);
        const vadBadge = document.getElementById('vad-indicator');

        setInterval(() => {
            if (!inRoom || isMuted) return;
            analyser.getByteFrequencyData(data);
            const volume = data.reduce((a, b) => a + b, 0) / data.length;
            const isSpeaking = volume > 12;

            if (audioTrack.enabled !== isSpeaking) {
                audioTrack.enabled = isSpeaking;
            }

            vadBadge.innerText = isSpeaking ? " يتحدث..." : "صامت";
            vadBadge.className = isSpeaking ? "badge active" : "badge";
        }, 200);
    }

    // 4. Dynamic Audio Room & Peer Cascade
    async function toggleAudioRoom() {
        const btn = document.getElementById('btn-join-room');
        const roomInput = document.getElementById('room-name-input');
        
        if (!inRoom) {
            currentRoomName = roomInput.value.trim().toLowerCase() || "general";
            window.location.hash = currentRoomName;

            await setupAudioWithVAD();
            inRoom = true;
            btn.innerText = "مغادرة الغرفة";
            roomInput.disabled = true;
            document.getElementById('btn-mute').disabled = false;

            subscribeRoomSignals();
            
            // Heartbeat: Announce presence every 4 seconds
            sendSignal({ type: "presence" });
            heartbeatInterval = setInterval(() => {
                if (inRoom) sendSignal({ type: "presence" });
            }, 4000);

        } else {
            inRoom = false;
            btn.innerText = "دخول الغرفة";
            roomInput.disabled = false;
            document.getElementById('btn-mute').disabled = true;
            window.location.hash = "";

            if (heartbeatInterval) clearInterval(heartbeatInterval);
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            peerConnections.forEach(pc => pc.close());
            peerConnections.clear();
            childrenKeys.clear();
            updatePeerCount();
        }
    }

    function toggleMute() {
        isMuted = !isMuted;
        if (localStream) localStream.getAudioTracks()[0].enabled = !isMuted;
        document.getElementById('btn-mute').innerText = isMuted ? "إلغاء الكتم" : "كتم المايك";
    }

    function getRoomTag() {
        return `${APP_TAG}-room-${currentRoomName}`;
    }

    function subscribeRoomSignals() {
        ws.send(JSON.stringify([
            "REQ", "room_sub",
            { kinds: [20000], "#t": [getRoomTag()], limit: 15 }
        ]));
    }

    async function sendSignal(payload, targetPk = null) {
        const event = {
            kind: 20000,
            pubkey: pk,
            created_at: Math.floor(Date.now() / 1000),
            tags: [["t", getRoomTag()]],
            content: JSON.stringify({ ...payload, target: targetPk })
        };
        event.id = NostrTools.getEventHash(event);
        event.sig = NostrTools.signEvent(event, sk);
        ws.send(JSON.stringify(["EVENT", event]));
    }

    async function handleSignalingEvent(event) {
        if (event.pubkey === pk) return;
        let data;
        try { data = JSON.parse(event.content); } catch (e) { return; }

        if (data.target && data.target !== pk) return;

        // Discovery via presence or explicit join
        if (data.type === "presence" || data.type === "join") {
            if (!peerConnections.has(event.pubkey) && childrenKeys.size < MAX_CHILDREN) {
                createPeer(event.pubkey, true);
            }
        } else if (data.type === "offer") {
            const pc = createPeer(event.pubkey, false);
            await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            sendSignal({ type: "answer", answer }, event.pubkey);
        } else if (data.type === "answer") {
            const pc = peerConnections.get(event.pubkey);
            if (pc) await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
        } else if (data.type === "candidate") {
            const pc = peerConnections.get(event.pubkey);
            if (pc && data.candidate) await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
        }
    }

    function createPeer(remotePk, isInitiator) {
        if (peerConnections.has(remotePk)) return peerConnections.get(remotePk);

        const pc = new RTCPeerConnection({
            iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
        });

        peerConnections.set(remotePk, pc);
        childrenKeys.add(remotePk);

        if (localStream) {
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
        }

        pc.ontrack = (evt) => {
            const audio = new Audio();
            audio.srcObject = evt.streams[0];
            audio.play();

            // Forward track to other peers in cascade tree
            peerConnections.forEach((otherPc, otherPk) => {
                if (otherPk !== remotePk) {
                    otherPc.addTrack(evt.track, evt.streams[0]);
                }
            });
        };

        pc.onicecandidate = (evt) => {
            if (evt.candidate) {
                sendSignal({ type: "candidate", candidate: evt.candidate }, remotePk);
            }
        };

        pc.onconnectionstatechange = () => {
            if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
                peerConnections.delete(remotePk);
                childrenKeys.delete(remotePk);
                updatePeerCount();
            }
        };

        if (isInitiator) {
            pc.onnegotiationneeded = async () => {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                sendSignal({ type: "offer", offer }, remotePk);
            };
        }

        updatePeerCount();
        return pc;
    }

    function updatePeerCount() {
        document.getElementById('peers-count').innerText = `المتصلون المباشرون: ${peerConnections.size}`;
    }

    function escapeHtml(str) {
        return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }

    window.onload = init;
</script>
</body>
</html>
