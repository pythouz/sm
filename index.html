<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse - Instant P2P Platform</title>
    <!-- Nostr Tools for Feed -->
    <script src="https://unpkg.com/nostr-tools@1.17.0/lib/nostr.bundle.js"></script>
    <!-- PeerJS for Instant Low-Latency WebRTC Voice -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #0b0f19;
            --card: #151d2a;
            --border: #232d3f;
            --accent: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --text: #f3f4f6;
            --muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 16px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
        h2 { font-size: 1.1rem; color: #a5b4fc; margin-bottom: 12px; }
        
        input, textarea { width: 100%; background: #070a12; border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 10px; margin-bottom: 10px; outline: none; }
        textarea { height: 70px; resize: none; }

        .btn { background: var(--accent); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn:hover { opacity: 0.9; }
        .btn-danger { background: var(--danger); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .status-bar { font-size: 0.8rem; color: var(--muted); margin-top: 8px; display: flex; justify-content: space-between; }
        .badge { background: var(--border); padding: 3px 8px; border-radius: 6px; }
        .badge.active { background: var(--success); color: black; }

        .feed-item { border-bottom: 1px solid var(--border); padding: 10px 0; }
        .feed-item:last-child { border-bottom: none; }
        .feed-header { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Identity -->
    <div class="card">
        <h2>الهوية والشبكة</h2>
        <div class="status-bar">
            <span id="my-id">Peer ID: جاري الإنشاء...</span>
            <span id="relay-status" class="badge">Nostr: جاري الاتصال...</span>
        </div>
    </div>

    <!-- Realtime P2P Voice Room -->
    <div class="card">
        <h2>الغرفة الصوتية المباشرة (PeerJS Mesh)</h2>
        <input type="text" id="room-input" placeholder="اسم الغرفة" value="pulse-main-room" />
        <div style="display: flex; gap: 10px;">
            <button class="btn" id="btn-join" onclick="toggleRoom()">دخول الغرفة</button>
            <button class="btn btn-danger" id="btn-mute" onclick="toggleMute()" disabled>كتم المايك</button>
        </div>
        <div class="status-bar">
            <span id="vad-status">الحالة: غير متصل</span>
            <span id="peer-count" class="badge">الأشخاص في الغرفة: 0</span>
        </div>
    </div>

    <!-- Text Feed -->
    <div class="card">
        <h2>نشر منشور</h2>
        <textarea id="post-input" placeholder="اكتب منشوراً فورياً..."></textarea>
        <button class="btn" onclick="publishPost()">نشر عبر Nostr</button>
    </div>

    <div class="card">
        <h2>التغذية المباشرة</h2>
        <div id="feed-container"></div>
    </div>
</div>

<!-- Container for remote audio elements -->
<div id="audio-container" style="display:none;"></div>

<script>
    const APP_TAG = "pulse-v3-demo";
    const NOSTR_RELAY = "wss://relay.damus.io";

    let peer = null;
    let localStream = null;
    let myPeerId = "";
    let currentRoom = "";
    let inRoom = false;
    let isMuted = false;

    let activeCalls = new Map(); // peerId -> call
    let roomPeers = new Set();
    
    let sk, pk, ws;

    // 1. Initialize Nostr & PeerJS
    async function init() {
        // Nostr Setup
        sk = localStorage.getItem('nostr_sk_v3') || NostrTools.generatePrivateKey();
        localStorage.setItem('nostr_sk_v3', sk);
        pk = NostrTools.getPublicKey(sk);

        ws = new WebSocket(NOSTR_RELAY);
        ws.onopen = () => {
            document.getElementById('relay-status').innerText = "Nostr: متصل";
            document.getElementById('relay-status').classList.add('active');
            subscribeFeed();
        };
        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if (data[0] === "EVENT" && data[2].kind === 1) {
                renderPost(data[2]);
            }
        };

        // PeerJS Setup
        initPeerJS();
    }

    function initPeerJS() {
        // Random short ID for user
        myPeerId = "pulse-" + Math.random().toString(36).substring(2, 9);
        peer = new Peer(myPeerId, {
            debug: 1,
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        });

        peer.on('open', (id) => {
            document.getElementById('my-id').innerText = `المعرف الصوتي: ${id}`;
        });

        // Handle incoming audio calls
        peer.on('call', (call) => {
            if (!inRoom) return;
            call.answer(localStream);
            handleCallEvents(call);
        });
    }

    // 2. Audio Room Management
    async function toggleRoom() {
        const btn = document.getElementById('btn-join');
        const roomInput = document.getElementById('room-input');

        if (!inRoom) {
            currentRoom = roomInput.value.trim().toLowerCase() || "pulse-main-room";

            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true }
                });
            } catch (e) {
                alert("تعذر الوصول للمايكروفون");
                return;
            }

            inRoom = true;
            btn.innerText = "مغادرة الغرفة";
            btn.classList.add("btn-danger");
            roomInput.disabled = true;
            document.getElementById('btn-mute').disabled = false;

            // Connect to Room Broker via DataConnection
            announcePresence();
            setupVAD();

        } else {
            leaveRoom();
        }
    }

    function leaveRoom() {
        inRoom = false;
        const btn = document.getElementById('btn-join');
        btn.innerText = "دخول الغرفة";
        btn.classList.remove("btn-danger");
        document.getElementById('room-input').disabled = false;
        document.getElementById('btn-mute').disabled = true;

        if (localStream) localStream.getTracks().forEach(t => t.stop());
        
        activeCalls.forEach(call => call.close());
        activeCalls.clear();
        document.getElementById('audio-container').innerHTML = "";
        document.getElementById('peer-count').innerText = "الأشخاص في الغرفة: 0";
        document.getElementById('vad-status').innerText = "الحالة: غير متصل";
    }

    function toggleMute() {
        isMuted = !isMuted;
        if (localStream) localStream.getAudioTracks()[0].enabled = !isMuted;
        document.getElementById('btn-mute').innerText = isMuted ? "إلغاء الكتم" : "كتم المايك";
    }

    // 3. Signaling via Nostr for Peer Discovery
    function announcePresence() {
        if (!inRoom) return;

        // Broadcast presence via Nostr so other peers know we joined
        const evt = {
            kind: 20000,
            pubkey: pk,
            created_at: Math.floor(Date.now() / 1000),
            tags: [["t", APP_TAG + "-" + currentRoom]],
            content: JSON.stringify({ peerId: myPeerId, action: "join" })
        };
        evt.id = NostrTools.getEventHash(evt);
        evt.sig = NostrTools.signEvent(evt, sk);
        ws.send(JSON.stringify(["EVENT", evt]));

        // Listen for other peers joining this room
        ws.send(JSON.stringify([
            "REQ", "room_discovery",
            { kinds: [20000], "#t": [APP_TAG + "-" + currentRoom], limit: 10 }
        ]));
    }

    // Handle Nostr discovery messages
    function handleRoomDiscovery(data) {
        if (data.peerId === myPeerId || !inRoom) return;

        const targetPeerId = data.peerId;
        if (!activeCalls.has(targetPeerId)) {
            // Call the discovered peer
            const call = peer.call(targetPeerId, localStream);
            handleCallEvents(call);
        }
    }

    function handleCallEvents(call) {
        activeCalls.set(call.peer, call);

        call.on('stream', (remoteStream) => {
            let audio = document.getElementById("audio-" + call.peer);
            if (!audio) {
                audio = document.createElement('audio');
                audio.id = "audio-" + call.peer;
                audio.autoplay = true;
                document.getElementById('audio-container').appendChild(audio);
            }
            audio.srcObject = remoteStream;
            updatePeerCount();
        });

        call.on('close', () => {
            const audio = document.getElementById("audio-" + call.peer);
            if (audio) audio.remove();
            activeCalls.delete(call.peer);
            updatePeerCount();
        });
    }

    function updatePeerCount() {
        document.getElementById('peer-count').innerText = `الأشخاص في الغرفة: ${activeCalls.size}`;
    }

    function setupVAD() {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(localStream);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);

        const data = new Uint8Array(analyser.frequencyBinCount);
        setInterval(() => {
            if (!inRoom || isMuted) return;
            analyser.getByteFrequencyData(data);
            const vol = data.reduce((a, b) => a + b, 0) / data.length;
            document.getElementById('vad-status').innerText = vol > 10 ? "الحالة: تتحدث الآن 🎙️" : "الحالة: متصل (صامت)";
        }, 300);
    }

    // 4. Nostr Feed System
    function subscribeFeed() {
        ws.send(JSON.stringify([
            "REQ", "feed_sub",
            { kinds: [1], "#t": [APP_TAG], limit: 20 }
        ]));
    }

    function publishPost() {
        const input = document.getElementById('post-input');
        const text = input.value.trim();
        if (!text) return;

        const evt = {
            kind: 1,
            pubkey: pk,
            created_at: Math.floor(Date.now() / 1000),
            tags: [["t", APP_TAG]],
            content: text
        };
        evt.id = NostrTools.getEventHash(evt);
        evt.sig = NostrTools.signEvent(evt, sk);

        ws.send(JSON.stringify(["EVENT", evt]));
        input.value = "";
    }

    const seenEvents = new Set();
    function renderPost(evt) {
        if (evt.kind === 20000) {
            try { handleRoomDiscovery(JSON.parse(evt.content)); } catch(e){}
            return;
        }

        if (seenEvents.has(evt.id)) return;
        seenEvents.add(evt.id);

        const container = document.getElementById('feed-container');
        const div = document.createElement('div');
        div.className = 'feed-item';
        div.innerHTML = `
            <div class="feed-header">${evt.pubkey.substring(0, 8)}... • ${new Date(evt.created_at * 1000).toLocaleTimeString('ar-EG')}</div>
            <div>${escapeHtml(evt.content)}</div>
        `;
        container.prepend(div);
    }

    function escapeHtml(str) {
        return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }

    window.onload = init;
</script>
</body>
</html>
